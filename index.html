<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swati Gupta</title>
<meta name="description" content="Swati Gupta: technical product marketer in New York. New site in progress.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600&display=swap">
<style>
  :root { --paper: #F9F9F8; --ink: #131216; --accent: #5B36C9; --soft: #5F5D66 }
  @media (prefers-color-scheme: dark) { :root { --paper: #131216; --ink: #F3F2F6; --soft: #A9A6B3; --accent: #9C82F0 } }
  * { box-sizing: border-box }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font-family: "Syne", "Helvetica Neue", Arial, sans-serif; padding: 16px }
  main { text-align: center }
  h1 { margin: 0; font-size: clamp(44px, 10vw, 112px); font-weight: 600; letter-spacing: -.03em; text-transform: lowercase }
  h1 span { color: var(--accent) }
  p { margin: 14px 0 0; color: var(--soft); font-size: 15px; letter-spacing: .04em; text-transform: uppercase }
</style>
</head>
<body>
<main>
  <h1>swati gupta<span>.</span></h1>
  <p>New site in progress</p>
</main>
</body>
</html>
